services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalcer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-UjiCoba0987}
      POSTGRES_DB: ${POSTGRES_DB:-kalcerplanner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: syncs the Prisma schema to the DB and seeds initial content, then exits.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kalcer}:${POSTGRES_PASSWORD:-kalcer_password}@db:5432/${POSTGRES_DB:-kalcerplanner}?schema=public
      # Optional: creates (or promotes) a curator account that can verify data at /pelaku.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kalcer}:${POSTGRES_PASSWORD:-kalcer_password}@db:5432/${POSTGRES_DB:-kalcerplanner}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Signs the login cookie. Must be set in .env (min. 16 chars, random).
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (see .env.example)}
      # Set to "true" when the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-9a6e8464486382}
      SMTP_PASS: ${SMTP_PASS:-341d74539ce7c0}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-KalcerPlanner <noreply@kalcerplanner.id>}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
